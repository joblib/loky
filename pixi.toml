[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[pypi-dependencies]
loky = { path = ".", editable = true }

[feature.macos-windows]
platforms = ["osx-arm64", "win-64"]

[feature.test.dependencies]
cython = "*"
setuptools = "*"
coverage = "*"
numpy = "*"
pytest = "*"
pytest-cov = "*"
pytest-timeout = "*"
tblib = "*"

[feature.test.tasks]
build-openmp-test-helper = {
    cmd = "python setup.py build_ext -i",
    cwd = "tests/_openmp_test_helper",
    default-environment = "py313"
}
test = {
    cmd = "bash continuous_integration/runtests.sh",
    depends-on = ["build-openmp-test-helper"],
    default-environment = "py313"
}
test-high-memory = {
    cmd = "bash continuous_integration/runtests.sh",
    depends-on = ["build-openmp-test-helper"],
    default-environment = "py313",
    env = { RUN_MEMORY = "true" }
}

[feature.test.target.osx-arm64.dependencies]
llvm-openmp = "*"
compilers = "*"

[feature.psutil.dependencies]
psutil = "*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.free-threaded]
platforms = ["linux-64"]

[feature.free-threaded.dependencies]
python-freethreading = "3.14.*"

[feature.viztracer]
platforms = ["linux-64"]

[feature.viztracer.dependencies]
viztracer = "*"

[feature.joblib]
platforms = ["linux-64"]

[feature.joblib.dependencies]
git = "*"
numpy = "*"
pip = "*"
pytest = "*"
pytest-asyncio = "*"
tblib = "*"
threadpoolctl = "*"

[feature.joblib.pypi-dependencies]
joblib = { git = "https://github.com/joblib/joblib.git" }

[feature.joblib.tasks]
test-joblib = { cmd = "bash continuous_integration/runtests.sh", env = { JOBLIB_TESTS = "true" } }

[feature.lint]
platforms = ["linux-64"]

[feature.lint.dependencies]
black = "25.1.0.*"

[feature.lint.tasks]
lint = "black --check --diff ."

[environments]
default = { features = [], no-default-feature = true }
lint = { features = ["lint"], no-default-feature = true }
py310 = ["test", "psutil", "py310"]
py310-no-psutil = ["test", "py310"]
py313 = ["test", "psutil", "py313"]
py313-viztracer = ["test", "psutil", "py313", "viztracer"]
py314 = ["test", "psutil", "py314", "macos-windows"]
py314-free-threaded = ["test", "psutil", "free-threaded"]
joblib-py310 = ["joblib", "psutil", "py310"]
